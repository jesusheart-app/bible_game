<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 가로/세로 화면 크기에 맞춰 자동으로 조절되는 반응형 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말씀 암송 게임</title>
    <style>
        /* 기본 글씨 크기를 28px로 아주 크게 설정 */
        :root { --base-size: 28px; }
        body { 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            font-size: var(--base-size); 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f6f8; 
            margin: 0;
            user-select: none; /* 글씨가 드래그되는 것 방지 */
        }
        
        /* 상단 글씨 크기 조절 버튼 디자인 */
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .controls span { font-weight: bold; color: #555; }
        .btn-control { 
            font-size: 0.9em; font-weight: bold; padding: 10px 20px; 
            background-color: #fff; border: 2px solid #ccc; border-radius: 10px; cursor: pointer; 
        }
        .btn-control:active { background-color: #eee; }

        /* 말씀 제목 */
        .title { font-weight: bold; font-size: 1.4em; margin-bottom: 20px; color: #2c3e50; }

        /* 빈칸(정답이 올라가는 곳) 영역 */
        .target-area { 
            min-height: 120px; border: 3px dashed #bdc3c7; border-radius: 15px; 
            padding: 20px; margin-bottom: 30px; background-color: white; 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center;
        }
        
        /* 섞인 단어들이 있는 곳 */
        .pool-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }

        /* 터치하는 말씀 버튼 공통 디자인 */
        button.word-btn, button.target-btn { 
            font-size: 1.1em; font-weight: bold; padding: 15px 25px; 
            border-radius: 15px; border: none; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            transition: transform 0.1s;
        }
        
        /* 누를 때 살짝 눌리는 효과 */
        button.word-btn:active, button.target-btn:active { transform: scale(0.95); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
        
        /* 아래쪽 대기 단어 버튼 색상 (초록색) */
        .word-btn { background-color: #27ae60; color: white; }
        
        /* 위쪽 선택된 단어 버튼 색상 (파란색) */
        .target-btn { background-color: #2980b9; color: white; }

        /* 성공 메시지 */
        .message { font-size: 1.5em; color: #e74c3c; font-weight: bold; margin-top: 30px; display: none; line-height: 1.5;}
        .restart-btn { 
            font-size: 1em; padding: 15px 30px; background-color: #f39c12; 
            color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. 글씨 크기 조절 영역 -->
    <div class="controls">
        <span>🔍 글씨: </span>
        <button class="btn-control" onclick="changeSize(4)">더 크게 ＋</button>
        <button class="btn-control" onclick="changeSize(-4)">작게 －</button>
    </div>

    <!-- 2. 말씀 제목 -->
    <div class="title">📖 로마서 12장 11절</div>

    <!-- 3. 단어가 맞춰질 정답 칸 -->
    <div class="target-area" id="target"></div>

    <!-- 4. 흩어진 단어들 -->
    <div class="pool-area" id="pool"></div>

    <!-- 5. 정답을 맞췄을 때 나오는 축하 메시지 -->
    <div class="message" id="message">
        🎉 아멘! 참 잘하셨습니다! 🎉<br>
        <button class="restart-btn" onclick="initGame()">다시 하기 ↻</button>
    </div>

    <script>
        // 정답 구절을 어르신이 읽기 편한 덩어리로 쪼개어 놓습니다.
        const correctOrder = ["부지런하여", "게으르지 말고", "열심을 품고", "주를 섬기라"];
        let currentWords = [];
        let poolWords = [];
        let currentSize = 28; // 초기 글씨 크기

        // 글씨 크기 조절 기능
        function changeSize(delta) {
            currentSize += delta;
            if (currentSize < 16) currentSize = 16; // 너무 작아지지 않게 방어
            if (currentSize > 50) currentSize = 50; // 너무 커지지 않게 방어
            document.documentElement.style.setProperty('--base-size', currentSize + 'px');
        }

        // 단어 섞기 기능
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 게임 시작 및 초기화
        function initGame() {
            currentWords = [];
            poolWords = shuffle([...correctOrder]);
            document.getElementById('message').style.display = 'none';
            render();
        }

        // 아래쪽 버튼을 누르면 위(정답칸)로 이동
        function moveToTarget(word, index) {
            poolWords.splice(index, 1);
            currentWords.push(word);
            render();
            checkWin();
        }

        // 위쪽 버튼을 잘못 누른 경우 다시 아래로 이동 (수정 기능)
        function moveToPool(word, index) {
            currentWords.splice(index, 1);
            poolWords.push(word);
            render();
        }

        // 화면에 버튼들을 그려주는 역할
        function render() {
            const targetDiv = document.getElementById('target');
            const poolDiv = document.getElementById('pool');
            
            targetDiv.innerHTML = '';
            poolDiv.innerHTML = '';

            // 위쪽 칸이 비어있을 때 안내문
            if(currentWords.length === 0) {
                targetDiv.innerHTML = '<span style="color:#999; font-size: 0.9em;">아래 말씀 조각을 순서대로 눌러보세요</span>';
            } else {
                currentWords.forEach((word, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'target-btn';
                    btn.innerText = word;
                    // 잘못 눌렀을 때 뺄 수 있도록 기능 연결
                    btn.onclick = () => moveToPool(word, index);
                    targetDiv.appendChild(btn);
                });
            }

            // 아래쪽 섞인 단어 버튼들 생성
            poolWords.forEach((word, index) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.innerText = word;
                btn.onclick = () => moveToTarget(word, index);
                poolDiv.appendChild(btn);
            });
        }

        // 정답 확인 기능
        function checkWin() {
            if (currentWords.length === correctOrder.length) {
                let isWin = true;
                for (let i = 0; i < correctOrder.length; i++) {
                    if (currentWords[i] !== correctOrder[i]) isWin = false;
                }
                
                if (isWin) {
                    // 정답일 경우 축하 메시지 띄우기
                    document.getElementById('message').style.display = 'block';
                    document.getElementById('pool').innerHTML = ''; // 성공하면 아래쪽 빈칸 비우기
                } else {
                    // 다 채웠는데 순서가 틀렸을 경우, 살짝 흔들리는 효과나 색상 변화를 줄 수도 있습니다.
                    // 현재는 그냥 멈춰있어 스스로 고치실 수 있도록 둡니다.
                }
            }
        }

        // 처음 실행
        initGame();
    </script>
</body>
</html>
